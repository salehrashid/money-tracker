name: money_tracker
description: "A private Flutter and Firebase personal finance tracker."
publish_to: 'none'
version: 1.6.6+10

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firedart: ^0.9.8
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.0
  file_picker: ^10.3.7
  csv: ^6.0.0
  circular_countdown_timer: ^0.2.4
  curved_labeled_navigation_bar: ^2.0.6
  uuid: ^4.5.1
  hive_ce: ^2.19.3
  path_provider: ^2.1.6
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  window_manager: ^0.5.2
  light_dark_theme_toggle: ^1.1.2
  shared_preferences: ^2.5.4
  excel: ^4.0.6
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - app-icon.png
